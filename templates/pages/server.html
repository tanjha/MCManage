  {% extends "base.html" %}
  {% block content %}
  <section class="panel">
    <p class="muted">{{ server.path }}</p>
    <h2>Properties</h2>
    <table>
      {% for key, value in server.properties.items() %}
        <tr><td>{{ key }}</td><td>{{ value }}</td></tr>
      {% endfor %}
    </table>
  </section>
  {% endblock %}
